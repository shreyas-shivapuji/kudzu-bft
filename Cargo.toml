[package]
name = "kudzu-bft"
version = "0.1.0"
edition = "2021"

[lib]
name = "kudzu_bft"
path = "src/lib.rs"

[[bin]]
name = "node"
path = "src/bin/node.rs"

[[bin]]
name = "sim"
path = "src/bin/sim.rs"

[dependencies]
sha2 = "0.10"
reed-solomon-erasure = "6.0"
rs_merkle = "1.4"
rand = "0.8"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
log = "0.4"
env_logger = "0.11"

